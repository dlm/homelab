apiVersion: apps/v1
kind: Deployment
metadata:
  name: startpage
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: startpage
  template:
    metadata:
      labels:
        app: startpage
    spec:
      containers:
        - name: startpage
          image: glanceapp/glance:latest
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /app/config
      volumes:
        - name: config
          configMap:
            name: startpage-config
---
apiVersion: v1
kind: Service
metadata:
  name: startpage
  namespace: apps
  labels:
    app: startpage
spec:
  selector:
    app: startpage
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: startpage
  namespace: apps
  labels:
    app: startpage
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca-issuer
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - startpage.lab.millman.us
      secretName: startpage-tls
  rules:
    - host: startpage.lab.millman.us
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: startpage
                port:
                  number: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: startpage-config
  namespace: apps
data:
  glance.yml: |
    pages:
      - name: Home
        columns:
          - size: small
            widgets:
              - type: search
                search-engine: https://search.brave.com/search?q={QUERY}
              - type: clock
                hourFormat: 24h
              - type: weather
                location: Bozeman, MT
                units: imperial

          - size: full
            widgets:
              - type: bookmarks
                groups:
                  - title: Homelab
                    links:
                      - title: Demo
                        url: http://demo.lab.millman.us
                      - title: Startpage
                        url: http://startpage.lab.millman.us
              - type: rss
                title: Reading
                limit: 10
                collapse-after: 5
                feeds:
                  - url: https://news.ycombinator.com/rss
                    title: Hacker News
                  - url: https://lobste.rs/rss
                    title: Lobsters

          - size: small
            widgets:
              - type: monitor
                title: Service Status
                sites:
                  - title: Demo
                    url: http://demo.lab.millman.us
                  - title: Startpage
                    url: http://startpage.lab.millman.us
