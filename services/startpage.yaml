apiVersion: apps/v1
kind: Deployment
metadata:
  name: startpage
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: startpage
  template:
    metadata:
      labels:
        app: startpage
    spec:
      containers:
        - name: startpage
          image: b4bz/homer:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: startpage
  namespace: apps
  labels:
    app: startpage
spec:
  selector:
    app: startpage
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: startpage
  namespace: apps
  labels:
    app: startpage
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca-issuer
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - startpage.lab.millman.us
      secretName: startpage-tls
  rules:
    - host: startpage.lab.millman.us
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: startpage
                port:
                  number: 80
